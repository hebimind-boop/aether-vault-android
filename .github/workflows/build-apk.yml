name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Standalone Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Project Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Prebuild Android Native Project
        run: |
          npx expo prebuild --platform android --clean --no-install

      - name: Apply Native React Native 0.74 Patches & Configure Offline Bundle
        run: |
          node scripts/patch-svg.js
          node scripts/configure-offline-bundle.js

      - name: Make Gradlew Executable
        run: |
          chmod +x android/gradlew

      - name: Assemble Release and Debug APKs with Embedded JS Bundle
        run: |
          cd android
          ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Verify Generated APKs
        run: |
          echo "=== Release APKs ==="
          ls -lh android/app/build/outputs/apk/release/ || true
          echo "=== Debug APKs ==="
          ls -lh android/app/build/outputs/apk/debug/ || true

      - name: Upload Standalone Release APK (Recommended for Devices)
        uses: actions/upload-artifact@v4
        with:
          name: aether-vault-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aether-vault-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
