name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Standalone Offline Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Project Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Prebuild Android Native Project
        run: |
          npx expo prebuild --platform android --clean --no-install

      - name: Apply Native React Native 0.74 Patches
        run: |
          node scripts/patch-svg.js

      - name: Generate Offline Standalone JavaScript Bundle
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res/

      - name: Make Gradlew Executable
        run: |
          chmod +x android/gradlew

      - name: Assemble Standalone Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify Generated Standalone APK
        run: |
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Standalone Offline Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aether-vault-standalone-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
